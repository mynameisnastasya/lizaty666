name: Railway static foundation checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: npm run test:unit
