name: Playwright checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # The default branch is an unrelated legacy storefront; its assertions must not be used for Floot Academy.
      - name: Legacy storefront browser checks
        if: (github.head_ref || github.ref_name) != 'migration/floot-academy-railway-20261114'
        run: npm run test:e2e
      - name: Original Floot Academy vs Railway browser checks
        if: (github.head_ref || github.ref_name) == 'migration/floot-academy-railway-20261114'
        run: npx playwright test --config playwright.academy.config.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
